
name: Build ExtremoVidas

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show project files
        run: find . -name pom.xml -print

      - name: Build plugin
        run: mvn --batch-mode -f ExtremoVidas-proyecto/pom.xml package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ExtremoVidas
          path: ExtremoVidas-proyecto/target/ExtremoVidas.jar
