
name: Build ExtremoVidas

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ExtremoVidas
          path: target/ExtremoVidas.jar
