
name: ExtremoVidas
version: 1.1.0
main: com.extremo.vidas.ExtremoVidas
api-version: '1.21'
description: Tres vidas, PvP, ruleta y misiones semanales

commands:
  vidas:
    description: Muestra tus vidas
  darvida:
    description: Dona una vida
  vidasadmin:
    description: Administra vidas
    permission: extremovidas.admin
  mision:
    description: Abre el menu de misiones semanales
  misionadmin:
    description: Configura las misiones semanales
    permission: extremovidas.admin

permissions:
  extremovidas.admin:
    description: Administrar vidas y misiones
    default: op
